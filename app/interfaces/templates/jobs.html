{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>识别任务</h1>
    <form id="upload-form" enctype="multipart/form-data">
        <input type="file" name="file" accept=".jpg,.jpeg,.png,.bmp,.tiff" required>
        <button type="submit">上传图片</button>
    </form>
    <span id="upload-status"></span>
</div>

<table class="table">
    <thead>
        <tr>
            <th>任务编号</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for job in jobs %}
        <tr>
            <td>{{ job.job_no }}</td>
            <td><span class="status status-{{ job.status|lower }}">{{ job.status }}</span></td>
            <td>{{ job.created_at.strftime('%Y-%m-%d %H:%M') if job.created_at else '-' }}</td>
            <td><a href="/jobs/{{ job.id }}">查看</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
document.getElementById('upload-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const fileInput = form.querySelector('input[type="file"]');
    const statusEl = document.getElementById('upload-status');

    if (!fileInput.files.length) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    statusEl.textContent = '上传中...';
    try {
        const resp = await fetch('/api/jobs/upload', { method: 'POST', body: formData });
        if (resp.ok) {
            statusEl.textContent = '上传成功';
            window.location.reload();
        } else {
            const data = await resp.json();
            statusEl.textContent = '上传失败: ' + (data.detail || '未知错误');
        }
    } catch (err) {
        statusEl.textContent = '上传失败: ' + err.message;
    }
});
</script>
{% endblock %}
